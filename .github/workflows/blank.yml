# Gera a "cobrinha" que come os quadradinhos de contribuição do perfil.
# Roda a cada 12 horas, a cada push na main e também manualmente (aba Actions → Run workflow).
# As imagens ficam no branch "output" e são usadas no README.
name: Gerar cobrinha de contribuições

on:
  schedule:
    - cron: "0 */12 * * *" # a cada 12 horas
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write # necessário para publicar no branch "output"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar as imagens da cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publicar no branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
